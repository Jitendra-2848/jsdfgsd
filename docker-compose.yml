services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: uk_wind_server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - energy-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: uk_wind_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      - VITE_BACKEND_URL=http://server:5000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - energy-net

networks:
  energy-net:
    driver: bridge
